name: gastos_mobile
description: "Aplicación móvil nativa para el control y gestión de gastos y finanzas personales."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local SQLite Offline Database & UUID
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0

  # Background Sync & Connectivity Listener
  connectivity_plus: ^6.0.3
  workmanager: ^0.10.10


  # Networking & HTTP
  dio: ^5.4.3+1

  # Secure Storage (JWT / Session persistence)
  flutter_secure_storage: ^9.2.2

  # Routing & Navigation
  go_router: ^14.1.4

  # UI, Icons & Typography
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utilities & Localization
  intl: ^0.20.2
  equatable: ^2.0.5
  fl_chart: ^1.2.0

  # Gallery, QR & OCR
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_document_scanner: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
